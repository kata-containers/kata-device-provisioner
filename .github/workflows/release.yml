# Cuts a release of main from the Actions tab: Release -> Run workflow. The
# version is the one committed in Cargo.toml, X.Y.Z or a prerelease
# X.Y.Z-alpha.N, -beta.N or -rc.N, and Chart.yaml must agree with it. The
# vX.Y.Z tag is created only once everything is published, so a failed run
# leaves no tag behind and can simply be run again. See RELEASING.md.

name: Release

on:
  workflow_dispatch:

# A second click waits for the first run instead of racing it to the same tag.
concurrency:
  group: release
  cancel-in-progress: false

permissions: {}

env:
  IMAGE: ghcr.io/${{ github.repository }}
  CHARTS: oci://ghcr.io/${{ github.repository_owner }}/kata-device-provisioner-charts
  NFD_CHARTS: https://kubernetes-sigs.github.io/node-feature-discovery/charts

jobs:
  preflight:
    name: Derive and check the version
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
      tags: ${{ steps.version.outputs.tags }}
      notes-start: ${{ steps.version.outputs.notes-start }}
    steps:
      # The Run workflow button offers every branch; only main is released.
      - name: Refuse anything but main
        env:
          REF: ${{ github.ref }}
        run: |
          if [[ "${REF}" != refs/heads/main ]]; then
            echo "::error::Releases are cut from main, not ${REF}"
            exit 1
          fi

      # Full history and tags: the release-notes range needs them.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install Rust toolchain
        run: rustup show

      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1

      # Cargo accepts versions this refuses, a +build suffix among them; they
      # would otherwise fail only once images are already pushed.
      - name: Derive the version
        id: version
        run: |
          set -euo pipefail
          version="$(cargo metadata --locked --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "kata-device-provisioner") | .version')"
          core='(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)'
          re="^${core}(-(alpha|beta|rc)\.(0|[1-9][0-9]*))?$"
          if [[ ! "${version}" =~ ${re} ]]; then
            echo "::error::Cargo.toml version ${version} is not X.Y.Z or X.Y.Z-(alpha|beta|rc).N"
            exit 1
          fi
          tag="v${version}"
          major_minor="${BASH_REMATCH[1]}.${BASH_REMATCH[2]}"

          chart_meta="$(helm show chart deploy/helm/kata-device-provisioner)"
          chart="$(sed -n 's/^version: //p' <<<"${chart_meta}")"
          app="$(sed -n 's/^appVersion: //p' <<<"${chart_meta}")"
          bad=0
          for pair in "Chart.yaml version=${chart}" "Chart.yaml appVersion=${app}"; do
            if [[ "${pair#*=}" != "${version}" ]]; then
              echo "::error::${pair%=*} is ${pair#*=}, but Cargo.toml says ${version}"
              bad=1
            fi
          done
          [[ "${bad}" == 0 ]] || exit 1

          if git rev-parse -q --verify "refs/tags/${tag}" >/dev/null; then
            echo "::error::${tag} is already released; bump the version first"
            exit 1
          fi

          if [[ -n "${BASH_REMATCH[4]}" ]]; then
            prerelease=true
            tags="${IMAGE}:${version}"
            notes_start=""
          else
            prerelease=false
            tags="${IMAGE}:${version},${IMAGE}:${major_minor},${IMAGE}:latest"
            # Notes for a final release cover everything since the previous
            # final release, not just what changed since its last -rc.
            notes_start="$(git tag --list 'v*' --merged "${GITHUB_SHA}" --sort=-v:refname \
              | grep -E "^v${core}$" | head -n1 || true)"
          fi
          {
            echo "tag=${tag}"
            echo "version=${version}"
            echo "prerelease=${prerelease}"
            echo "tags=${tags}"
            echo "notes-start=${notes_start}"
          } >> "${GITHUB_OUTPUT}"

      # CI ran on the pull request, but what is published is this commit.
      - run: cargo test --locked

      - name: Verify committed profile index
        run: cargo run --locked --manifest-path tools/profile-index/Cargo.toml -- --check

      - name: Lint the chart
        run: |
          helm repo add node-feature-discovery "${NFD_CHARTS}"
          helm dependency build deploy/helm/kata-device-provisioner
          helm lint deploy/helm/kata-device-provisioner

  image:
    name: Build ${{ matrix.arch }}
    needs: preflight
    # Native runners: the Dockerfile builds for the musl target of whatever
    # machine it runs on, so there is no cross-compilation to lean on.
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-26.04
          - arch: arm64
            runner: ubuntu-26.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Short commit
        id: sha
        run: echo "short=${GITHUB_SHA::7}" >> "${GITHUB_OUTPUT}"

      # Pushed by digest only; the tags go on the multi-arch index once every
      # architecture has built, so no tag ever names half a release. No build
      # cache: a release must not be built from layers a PR run could have
      # written. Inline provenance is off because it adds "unknown/unknown"
      # entries to the index; the attestation below records it as an OCI
      # referrer instead.
      - name: Build and push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          build-args: GIT_SHA=${{ steps.sha.outputs.short }}
          labels: |
            org.opencontainers.image.version=${{ needs.preflight.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
          provenance: false
          sbom: false
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true

      # The image has no shell, so this is the only way to find out it starts.
      - name: Smoke test
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          set -euo pipefail
          out="$(docker run --rm "${IMAGE}@${DIGEST}" --version)"
          echo "${out}"
          [[ "${out}" == "kata-device-provisioner ${VERSION}" ]]

      # A consumer resolving one platform pins the per-architecture digest,
      # not the index's, so each one is attested in its own right.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Record the digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p digests
          touch "digests/${DIGEST#sha256:}"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: digest-${{ matrix.arch }}
          path: digests/*
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish
    needs: [preflight, image]
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: digest-*
          path: digests
          merge-multiple: true

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # :latest and :X.Y move only for a final release, so an -rc never becomes
      # what everybody pulls by default.
      - name: Tag the multi-arch index
        id: index
        env:
          TAGS: ${{ needs.preflight.outputs.tags }}
          VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          set -euo pipefail
          args=()
          IFS=, read -ra refs <<<"${TAGS}"
          for r in "${refs[@]}"; do args+=(-t "${r}"); done
          for d in digests/*; do args+=("${IMAGE}@sha256:${d#digests/}"); done
          docker buildx imagetools create "${args[@]}"
          digest="$(docker buildx imagetools inspect "${IMAGE}:${VERSION}" \
            --format '{{json .Manifest}}' | jq -r .digest)"
          echo "digest=${digest}" >> "${GITHUB_OUTPUT}"

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.index.outputs.digest }}
          push-to-registry: true

      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1

      # The OCI chart's layer is this tarball byte for byte, so attesting the
      # file also covers what `helm pull` fetches from the registry.
      - name: Package the chart
        run: |
          set -euo pipefail
          helm repo add node-feature-discovery "${NFD_CHARTS}"
          helm dependency build deploy/helm/kata-device-provisioner
          helm package deploy/helm/kata-device-provisioner --destination out
          (cd out && sha256sum -- *.tgz > SHA256SUMS)

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: out/*.tgz

      - name: Push the chart
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          helm registry login ghcr.io --username "${GITHUB_ACTOR}" --password-stdin <<<"${GITHUB_TOKEN}"
          helm push out/*.tgz "${CHARTS}"

      # Last, and it creates the tag, so nothing is tagged or announced that
      # failed to build, start or push.
      - name: Tag and publish the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.preflight.outputs.tag }}
          VERSION: ${{ needs.preflight.outputs.version }}
          PRERELEASE: ${{ needs.preflight.outputs.prerelease }}
          NOTES_START: ${{ needs.preflight.outputs.notes-start }}
          INDEX_DIGEST: ${{ steps.index.outputs.digest }}
        run: |
          set -euo pipefail
          if gh release view "${TAG}" >/dev/null 2>&1; then
            gh release upload "${TAG}" out/* --clobber
            exit 0
          fi
          notes="$(cat <<EOF
          Image: \`${IMAGE}:${VERSION}\` (\`${INDEX_DIGEST}\`)

          Chart:

              helm install kata-device-provisioner ${CHARTS}/kata-device-provisioner \\
                --version ${VERSION} --namespace kata-system --create-namespace

          The image index, each architecture in it and the chart tarball are
          attested:

              gh attestation verify oci://${IMAGE}@<digest> --repo ${GITHUB_REPOSITORY}
              gh attestation verify kata-device-provisioner-${VERSION}.tgz --repo ${GITHUB_REPOSITORY}
          EOF
          )"
          args=(--target "${GITHUB_SHA}" --title "${TAG}" --notes "${notes}" --generate-notes)
          if [[ "${PRERELEASE}" == true ]]; then
            args+=(--prerelease --latest=false)
          else
            args+=(--latest)
            [[ -z "${NOTES_START}" ]] || args+=(--notes-start-tag "${NOTES_START}")
          fi
          gh release create "${TAG}" out/* "${args[@]}"
