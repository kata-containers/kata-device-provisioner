{{- /*
Generated from the PCI identity catalog in pcilibs-rs by
`UPDATE_NODE_FEATURE_RULE=1 cargo test --test node_feature_rule`. Do not edit
by hand: `cargo test` fails when this file and the catalog disagree.

The labels select candidates for a profile's Job. They prove PCI identity and
nothing else: only the provisioner's VPD discovery on the node can tell a
ConnectX management PF from the NIC beside it, and a candidate label never
authorizes a binding.

GPU identities are the catalog's, keyed on device id and, where one device id
is sold as more than one attachment, on subsystem device id as well. That is
the same catalog the binary classifies devices with, so a part the catalog
does not know is a node that is not selected, never one that is mislabelled.

Cluster-scoped with no node-specific content, so the release owns it and
`helm uninstall` takes it away.
*/ -}}
{{- if include "kata-device-provisioner.nodeFeatureRuleEnabled" . | trim }}
apiVersion: nfd.k8s-sigs.io/v1alpha1
kind: NodeFeatureRule
metadata:
  name: {{ .Chart.Name }}
  labels:
{{- include "kata-device-provisioner.labels" . | nindent 4 }}
spec:
  rules:
    # Any NVIDIA 3D controller: the PCIe profiles' base match.
    - name: "nvidia.gpu"
      labels:
        "kata.feature.node.kubernetes.io/nvidia-gpu": "true"
      matchFeatures:
        - feature: pci.device
          matchExpressions:
            vendor: { op: In, value: ["10de"] }
            class: { op: In, value: ["0302"] }
    # A host-visible NVSwitch, which is what makes an Hx00 baseboard.
    # NFD does not label class 0680 by default, so this rule does.
    - name: "nvidia.nvswitch"
      labels:
        "kata.feature.node.kubernetes.io/nvidia-nvswitch": "true"
      matchFeatures:
        - feature: pci.device
          matchExpressions:
            vendor: { op: In, value: ["10de"] }
            class: { op: In, value: ["0680"] }
    # SXM Hopper parts: the GPU half of an HGX Hx00 baseboard. Coherent GH200
    # and PCIe cards are not HGX and are left out.
    - name: "nvidia.hopper"
      labels:
        "kata.feature.node.kubernetes.io/nvidia-hopper": "true"
      matchFeatures:
        - feature: pci.device
          matchExpressions:
            vendor: { op: In, value: ["10de"] }
            class: { op: In, value: ["0302"] }
            device: { op: In, value: ["2324", "2328", "2329", "232c", "2330", "2335", "2336", "2337", "2338", "2339"] }
    # SXM Blackwell parts: the GPU half of an HGX Bx00 baseboard. A device id
    # sold both as SXM and as a coherent or PCIe part is narrowed by subsystem.
    - name: "nvidia.blackwell"
      labels:
        "kata.feature.node.kubernetes.io/nvidia-blackwell": "true"
      matchAny:
        - matchFeatures:
            - feature: pci.device
              matchExpressions:
                vendor: { op: In, value: ["10de"] }
                class: { op: In, value: ["0302"] }
                device: { op: In, value: ["2901", "2920", "29f1", "3182", "3183", "3184", "31fe", "3224", "323e"] }
        - matchFeatures:
            - feature: pci.device
              matchExpressions:
                vendor: { op: In, value: ["10de"] }
                class: { op: In, value: ["0302"] }
                device: { op: In, value: ["293d"] }
                subsystem_device: { op: In, value: ["197f", "1999"] }
        - matchFeatures:
            - feature: pci.device
              matchExpressions:
                vendor: { op: In, value: ["10de"] }
                class: { op: In, value: ["0302"] }
                device: { op: In, value: ["29bc"] }
                subsystem_device: { op: In, value: ["1985"] }
        - matchFeatures:
            - feature: pci.device
              matchExpressions:
                vendor: { op: In, value: ["10de"] }
                class: { op: In, value: ["0302"] }
                device: { op: In, value: ["31c2"] }
                subsystem_device: { op: In, value: ["20e5", "20e6"] }
    # SXM and coherent Rubin parts. On Rubin, attachment does not decide
    # whether CC can be enabled, so the Rx00 profile takes both.
    - name: "nvidia.rubin"
      labels:
        "kata.feature.node.kubernetes.io/nvidia-rubin": "true"
      matchFeatures:
        - feature: pci.device
          matchExpressions:
            vendor: { op: In, value: ["10de"] }
            class: { op: In, value: ["0302"] }
            device: { op: In, value: ["3002", "3041", "307e", "30ff"] }
    # Every device id the catalog knows a coherent variant of, by device id
    # alone, subsystem notwithstanding: the same conservative answer
    # `pcilibs_rs::cc::is_c2c` gives the binary, so the PCIe profiles never
    # select a node whose GPU the binary would then refuse plain vfio-pci for.
    - name: "nvidia.c2c"
      labels:
        "kata.feature.node.kubernetes.io/nvidia-c2c": "true"
      matchFeatures:
        - feature: pci.device
          matchExpressions:
            vendor: { op: In, value: ["10de"] }
            class: { op: In, value: ["0302"] }
            device: { op: In, value: ["2342", "2343", "2345", "2348", "2941", "297e", "29bc", "3041", "307e", "30ff", "31a1", "31c2", "31c3"] }
    # Coherent Blackwell: GB200 and GB300 superchips, which GBx00 selects.
    - name: "nvidia.grace-blackwell"
      labels:
        "kata.feature.node.kubernetes.io/nvidia-grace-blackwell": "true"
      matchAny:
        - matchFeatures:
            - feature: pci.device
              matchExpressions:
                vendor: { op: In, value: ["10de"] }
                class: { op: In, value: ["0302"] }
                device: { op: In, value: ["2941", "297e", "31a1", "31c3"] }
        - matchFeatures:
            - feature: pci.device
              matchExpressions:
                vendor: { op: In, value: ["10de"] }
                class: { op: In, value: ["0302"] }
                device: { op: In, value: ["29bc"] }
                subsystem_device: { op: In, value: ["2045"] }
        - matchFeatures:
            - feature: pci.device
              matchExpressions:
                vendor: { op: In, value: ["10de"] }
                class: { op: In, value: ["0302"] }
                device: { op: In, value: ["31c2"] }
                subsystem_device: { op: In, value: ["21f1"] }
    # An SXM Blackwell or Rubin GPU beside an InfiniBand ConnectX function.
    # On those baseboards the NVSwitches are not on PCI and the fabric is
    # reached through ConnectX management PFs, which NFD cannot tell from
    # a NIC: the Job qualifies them by VPD and refuses the node otherwise.
    - name: "nvidia.managed-fabric-candidate"
      labels:
        "kata.feature.node.kubernetes.io/nvidia-managed-fabric-candidate": "true"
      matchFeatures:
        - feature: pci.device
          matchExpressions:
            vendor: { op: In, value: ["15b3"] }
            class: { op: In, value: ["0207"] }
      matchAny:
        - matchFeatures:
            - feature: pci.device
              matchExpressions:
                vendor: { op: In, value: ["10de"] }
                class: { op: In, value: ["0302"] }
                device: { op: In, value: ["2901", "2920", "29f1", "3182", "3183", "3184", "31fe", "3224", "323e"] }
        - matchFeatures:
            - feature: pci.device
              matchExpressions:
                vendor: { op: In, value: ["10de"] }
                class: { op: In, value: ["0302"] }
                device: { op: In, value: ["293d"] }
                subsystem_device: { op: In, value: ["197f", "1999"] }
        - matchFeatures:
            - feature: pci.device
              matchExpressions:
                vendor: { op: In, value: ["10de"] }
                class: { op: In, value: ["0302"] }
                device: { op: In, value: ["29bc"] }
                subsystem_device: { op: In, value: ["1985"] }
        - matchFeatures:
            - feature: pci.device
              matchExpressions:
                vendor: { op: In, value: ["10de"] }
                class: { op: In, value: ["0302"] }
                device: { op: In, value: ["31c2"] }
                subsystem_device: { op: In, value: ["20e5", "20e6"] }
        - matchFeatures:
            - feature: pci.device
              matchExpressions:
                vendor: { op: In, value: ["10de"] }
                class: { op: In, value: ["0302"] }
                device: { op: In, value: ["3002", "3041", "307e", "30ff"] }
{{- end }}
