apiVersion: v2
name: kata-device-provisioner
description: Puts a node's passthrough GPUs into a CC mode and binds them to vfio-pci
type: application

# The chart and the binary are released together from one tag, so both of
# these equal the crate version in Cargo.toml. The release workflow refuses a
# tag they disagree with. See RELEASING.md.
version: "0.1.0-alpha.1"

# Version of kata-device-provisioner this chart deploys by default.
appVersion: "0.1.0-alpha.1"

keywords:
  - kata
  - gpu
  - vfio
  - confidential-computing
home: https://katacontainers.io/
sources:
  - https://github.com/kata-containers/kata-device-provisioner
maintainers:
  - name: The Kata Containers community
    email: kata-dev@lists.katacontainers.io

dependencies:
  - name: node-feature-discovery
    version: "0.19.0"
    repository: https://kubernetes-sigs.github.io/node-feature-discovery/charts
    condition: node-feature-discovery.enabled
