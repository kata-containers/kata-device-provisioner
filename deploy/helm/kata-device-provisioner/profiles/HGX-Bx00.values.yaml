# HGX Bx00: SXM boards bound for passthrough, confidential computing left off.
#
# Selects Blackwell HGX nodes — B200, B300, and any other GB100/GB110 SXM board
# — by GPU identity plus a managed-fabric candidate. On these baseboards the
# NVSwitches are not on PCI: the fabric is reached through the management
# ConnectX PFs, which NFD cannot tell from the data-path NICs beside them, so
# the Job qualifies them by VPD role and refuses the node otherwise. Each GPU
# and the whole fabric is bound to vfio-pci, the fabric for a ServiceVM; CC mode
# is not raised. Discrete cards, other generations, and GB200/GB300 (superchips,
# whose GPUs need `nvgrace_gpu_vfio_pci`) are out of scope.
#
#   helm install kata-device-provisioner deploy/helm/kata-device-provisioner \
#     --namespace kata-system --create-namespace \
#     -f deploy/helm/kata-device-provisioner/profiles/HGX-Bx00.values.yaml

profiles:
  HGX-Bx00:
    enabled: true
    bindFabric: true
    ccMode: "off"

    nodeFeatureRule:
      enabled: true

    nodeSelector:
      kata.feature.node.kubernetes.io/nvidia-blackwell: "true"
      kata.feature.node.kubernetes.io/nvidia-managed-fabric-candidate: "true"

    job:
      # A mode change resets the GPUs, so this paces how much of the fleet loses
      # accelerators at once. Raise it once you trust the rollout.
      parallelism: 2
      activeDeadlineSeconds: 3600
