# The ServiceVM needs the management PFs even when workload GPUs use CC.
# NFD selects candidates; pcilibs-rs must confirm their VPD management role.

profiles:
  HGX-Bx00:
    enabled: true
    bindFabric: true
    ccMode: "off"

    nodeFeatureRule:
      enabled: true

    nodeSelector:
      kata.feature.node.kubernetes.io/nvidia-blackwell: "true"
      kata.feature.node.kubernetes.io/nvidia-managed-fabric-candidate: "true"

    job:
      # A mode change resets the GPUs, so this paces how much of the fleet loses
      # accelerators at once. Raise it once you trust the rollout.
      parallelism: 2
      activeDeadlineSeconds: 3600
