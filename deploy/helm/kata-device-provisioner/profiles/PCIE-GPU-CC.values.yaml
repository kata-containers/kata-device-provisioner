# PCIE-GPU-CC: discrete cards, one CC-mode GPU per confidential VM.
#
# Selects nodes that have an NVIDIA GPU and no NVSwitch — add-in cards rather
# than an SXM baseboard. Each card is put into CC mode and bound to vfio-pci.
# Cards paired over an NVLink bridge are still two independent GPUs to this
# component: each gets its own mode and its own binding, and nothing here
# arranges for one VM to receive both.
#
#   helm install kata-device-provisioner deploy/helm/kata-device-provisioner \
#     --namespace kata-system --create-namespace \
#     -f deploy/helm/kata-device-provisioner/profiles/PCIE-GPU-CC.values.yaml

ccMode: "on"

nodeFeatureRule:
  enabled: true

nodeSelector:
  kata.feature.node.kubernetes.io/nvidia-gpu: "true"

# Absence is the whole point of this profile, and a nodeSelector map cannot
# say it: without these, HGX baseboards and Grace superchips match here too.
# A Grace CPU has no CC of its own, so `on` there is refused, not provisioned.
nodeSelectorExpressions:
  - "!kata.feature.node.kubernetes.io/nvidia-nvswitch"
  - "!kata.feature.node.kubernetes.io/nvidia-c2c"

job:
  parallelism: 10
